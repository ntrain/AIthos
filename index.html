<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIthos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-container">
      <div class="logo"><h1><em>A</em><em>I</em>thos</h1></div>
      <div class="tagline">Respectful & Ethical Conversations</div>
    </div>
  </header>

  <!-- Main Body -->
  <main>
    <section class="left-panel">
      <h2>Welcome to AIthos</h2>
      <p>Type your questions here:</p>
      <div id="chatbox">
        <input type="text" id="userInput" placeholder="Type your question...">
        <button onclick="handleInput()">Send</button>
      </div>
    </section>

    <!-- Response section anchored bottom right -->
    <section class="response-panel">
      <div id="conversation"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 AIthos. All rights reserved. | <span class="author">Author: Nicole Train</span></p>
  </footer>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
