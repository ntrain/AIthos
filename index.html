<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIthos Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <h1>AIthos</h1>
      </div>
      <div class="tagline">Illuminating ideas with clarity</div>
    </div>
  </header>

  <main>
    <section class="left-panel">
      <h2>Conversation</h2>
      <div id="conversation"></div>

      <div id="chatbox">
        <input type="text" id="user-input" placeholder="Type your message...">
        <button id="send-btn">Send</button>
      </div>
    </section>

    <!-- Right side fixed panel for responses or tips -->
    <aside class="response-panel">
      <h3>AIthos (Demo Mode)</h3>
      <p>Running locally without Azure. Messages echo back with glow and fade-in.</p>
    </aside>
  </main>

  <footer>
    <p>© 2025 AIthos • Crafted with focus and glow</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
