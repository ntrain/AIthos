<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIthos Interface</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <h1>AIthos</h1>
      </div>
      <div class="tagline">Ethical AI that listens, respects, and connects — where artificial intelligence meets human values.</div>
    </div>
  </header>

  <main>
    <section class="left-panel">
      <h2>Welcome to AIthos</h2>
      <p>Your AI companion for ethical and respectful conversations.</p>
      <div id="chatbox">
        <input id="userInput" type="text" placeholder="Ask me anything...">
        <button id="sendBtn">Send</button>
      </div>
    </section>

    <section class="response-panel">
      <div id="conversation">
        <!-- Responses will appear here -->
      </div>
    </section>
  </main>

  <footer>
    <p>Powered by AIthos — Nicole Train</p>
  </footer>

  <script src="script.js?v=2"></script>
</body>
</html>
