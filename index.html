<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIthos Interface</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <h1>AIthos</h1>
      </div>
      <div class="tagline">Welcome to AIthos</div>
    </div>
  </header>

  <main>
    <section class="left-panel">
      <h2>Welcome to AIthos</h2>
      <p>Your AI companion for knowledge, creativity, and productivity.</p>
      <div id="chatbox">
        <input id="userInput" type="text" placeholder="Ask me anything...">
        <button id="sendBtn">Send</button>
      </div>
    </section>

    <section class="response-panel">
      <div id="conversation">
        <!-- Responses will appear here -->
      </div>
    </section>
  </main>

  <footer>
    <p>Powered by AIthos <span class="author">Nicole</span></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
